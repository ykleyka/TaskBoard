name: CI/CD

on:
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Test backend
        run: mvn -B test

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t taskboard:${{ github.sha }} .

  deploy:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    env:
      DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
      DEPLOYMENT_URL: ${{ secrets.DEPLOYMENT_URL }}
      DEPLOY_WAIT_SECONDS: ${{ vars.DEPLOY_WAIT_SECONDS || '90' }}

    steps:
      - name: Trigger deploy
        if: env.DEPLOY_HOOK_URL != ''
        run: curl -fsS -X POST "${DEPLOY_HOOK_URL}?ref=${GITHUB_SHA}"

      - name: Skip deploy when hook is not configured
        if: env.DEPLOY_HOOK_URL == ''
        run: echo "DEPLOY_HOOK_URL is not configured; deployment was skipped."

      - name: Wait for deployment
        if: env.DEPLOYMENT_URL != ''
        run: sleep "$DEPLOY_WAIT_SECONDS"

      - name: Healthcheck
        if: env.DEPLOYMENT_URL != ''
        run: |
          for attempt in {1..30}; do
            if curl -fsS "$DEPLOYMENT_URL/actuator/health" | grep -q '"status":"UP"'; then
              echo "Healthcheck passed."
              exit 0
            fi
            echo "Healthcheck attempt $attempt failed; retrying..."
            sleep 10
          done
          echo "Healthcheck failed."
          exit 1

      - name: Skip healthcheck when service URL is not configured
        if: env.DEPLOYMENT_URL == ''
        run: echo "DEPLOYMENT_URL is not configured; healthcheck was skipped."
