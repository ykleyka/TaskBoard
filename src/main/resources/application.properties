spring.application.name=TaskBoard
spring.config.import=optional:file:./.env[.properties]

server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.display-request-duration=true
server.tomcat.threads.max=400

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

taskboard.security.jwt-secret=${JWT_SECRET:change-me-taskboard-dev-secret}
taskboard.security.token-ttl=PT24H
taskboard.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
taskboard.frontend.url=${FRONTEND_URL:${RENDER_EXTERNAL_URL:http://localhost:5173}}
